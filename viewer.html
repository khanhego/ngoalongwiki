<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Ngoạ Long</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --sidebar: #1a2332;
      --surface: #243044;
      --border: #2d3f56;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #c9a227;
      --search-bg: #1e2a3a;
      --highlight: #3d4f2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 320px;
      min-width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }
    .back-link:hover { color: var(--accent); }
    .sidebar-header h1 { font-size: 1.05rem; color: var(--accent); margin-bottom: 4px; }
    .sidebar-header p { font-size: 0.75rem; color: var(--muted); }
    .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .search-box input {
      width: 100%;
      padding: 10px 12px;
      background: var(--search-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .search-box input:focus { outline: none; border-color: var(--accent); }
    .search-results { max-height: 200px; overflow-y: auto; display: none; }
    .search-results.active { display: block; }
    .search-result-item {
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .search-result-item:hover { background: var(--surface); }
    .search-result-item .doc { color: var(--muted); font-size: 0.75rem; }
    .search-result-item mark {
      background: var(--highlight);
      color: var(--accent);
      padding: 0 2px;
      border-radius: 2px;
    }
    .tree-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .tree-doc { margin-bottom: 4px; }
    .tree-doc-header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      user-select: none;
    }
    .tree-doc-header:hover { background: var(--surface); }
    .tree-doc-header .order {
      color: var(--accent);
      margin-right: 8px;
      font-size: 0.8rem;
      min-width: 20px;
    }
    .tree-doc-header .arrow {
      margin-left: auto;
      color: var(--muted);
      transition: transform 0.2s;
      font-size: 0.7rem;
    }
    .tree-doc-header.open .arrow { transform: rotate(90deg); }
    .tree-sections { display: none; padding-left: 12px; }
    .tree-sections.open { display: block; }
    .tree-section {
      padding: 6px 16px 6px 28px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      border-left: 2px solid transparent;
    }
    .tree-section:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .tree-section.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(201,162,39,0.08);
    }
    .tree-section.h2 { font-weight: 500; color: var(--text); }
    .tree-section.h3 { padding-left: 40px; font-size: 0.78rem; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .breadcrumb {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .breadcrumb span { color: var(--accent); }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 40px 60px;
      max-width: 900px;
    }
    .content-area h1 { font-size: 1.8rem; margin-bottom: 16px; color: var(--accent); }
    .content-area h2 { font-size: 1.4rem; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .content-area h3 { font-size: 1.15rem; margin: 20px 0 10px; color: #d4b84a; }
    .content-area p { line-height: 1.75; margin-bottom: 12px; text-align: justify; }
    .content-area strong { color: #e8edf4; }
    .content-area ul, .content-area ol {
      padding-left: 1.5em;
      margin: 10px 0 14px;
      line-height: 1.75;
    }
    .content-area li { margin-bottom: 6px; }
    .content-area li ul, .content-area li ol { margin-top: 6px; margin-bottom: 6px; }
    .content-area table.wiki-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 20px;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .content-area table.wiki-table td,
    .content-area table.wiki-table th {
      border: 1px solid var(--border);
      padding: 10px 12px;
      vertical-align: top;
      text-align: left;
    }
    .content-area table.wiki-table tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.03);
    }
    .content-area img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 12px 0;
      border: 1px solid var(--border);
      display: block;
    }
    .welcome { padding: 40px 20px; color: var(--muted); }
    .welcome h2 { color: var(--text); margin-bottom: 12px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <a class="back-link" href="index.html">← Trang chủ</a>
      <h1 id="collectionTitle">Wiki Ngoạ Long</h1>
      <p id="collectionDesc"></p>
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Tìm kiếm từ khóa..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <nav class="tree-nav" id="treeNav"></nav>
  </aside>

  <main class="main">
    <div class="breadcrumb" id="breadcrumb">Chọn mục từ cây bên trái</div>
    <article class="content-area" id="content">
      <div class="welcome">
        <h2 id="welcomeTitle">Chào mừng</h2>
        <p>Chọn mục trong cây navigation bên trái hoặc dùng ô tìm kiếm.</p>
      </div>
    </article>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const collectionId = params.get('c') || 'cam-nang-thuc-quoc';

    let tree = null;
    let searchIndex = [];
    let collectionInfo = null;

    function removeAccents(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    function normalize(str) { return removeAccents(str.toLowerCase()); }

    async function loadData() {
      const [siteRes, treeRes, indexRes] = await Promise.all([
        fetch('data/site.json'),
        fetch(`data/tree-${collectionId}.json`),
        fetch('data/search-index.json')
      ]);

      const site = await siteRes.json();
      collectionInfo = site.collections.find(c => c.id === collectionId);
      if (!collectionInfo) {
        document.getElementById('content').innerHTML = '<p>Collection không tồn tại.</p>';
        return;
      }

      tree = await treeRes.json();
      searchIndex = (await indexRes.json()).filter(e => e.collection === collectionId);

      document.getElementById('collectionTitle').textContent =
        `${collectionInfo.icon} ${collectionInfo.title}`;
      document.getElementById('collectionDesc').textContent = collectionInfo.description;
      document.getElementById('welcomeTitle').textContent = collectionInfo.title;
      document.title = `Wiki Ngoạ Long — ${collectionInfo.title}`;

      renderTree();
    }

    function renderTree() {
      const nav = document.getElementById('treeNav');
      nav.innerHTML = tree.children.map(doc => `
        <div class="tree-doc" data-doc="${doc.id}">
          <div class="tree-doc-header" onclick="toggleDoc('${doc.id}')">
            <span class="order">${doc.order}.</span>
            <span>${doc.title}</span>
            <span class="arrow">▶</span>
          </div>
          <div class="tree-sections" id="sections-${doc.id}">
            ${doc.children.map(sec => {
              const fullId = `${collectionId}/${sec.id}`;
              return `
              <div class="tree-section ${sec.level || 'h2'}"
                   data-id="${fullId}"
                   data-file="${sec.file}"
                   onclick="loadSection('${fullId}', '${sec.file}', event)">
                ${sec.title}
              </div>`;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleDoc(docId) {
      document.querySelector(`[data-doc="${docId}"] .tree-doc-header`).classList.toggle('open');
      document.getElementById(`sections-${docId}`).classList.toggle('open');
    }

    async function loadSection(id, file, event) {
      if (event) event.stopPropagation();
      document.querySelectorAll('.tree-section').forEach(el => el.classList.remove('active'));
      const active = document.querySelector(`[data-id="${id}"]`);
      if (active) active.classList.add('active');

      const entry = searchIndex.find(e => e.id === id);
      const filePath = entry ? entry.file : `content/${collectionId}/${file}`;

      try {
        const res = await fetch(filePath);
        const md = await res.text();
        document.getElementById('content').innerHTML = marked.parse(md);
        document.getElementById('breadcrumb').innerHTML = entry
          ? `<span>${entry.docTitle}</span> › ${entry.sectionTitle}`
          : file;
      } catch (e) {
        document.getElementById('content').innerHTML = `<p>Không tải được: ${filePath}</p>`;
      }
      document.getElementById('searchResults').classList.remove('active');
    }

    function search(query) {
      const q = normalize(query.trim());
      if (!q || q.length < 2) {
        document.getElementById('searchResults').classList.remove('active');
        return;
      }
      const terms = q.split(/\s+/);
      const scored = searchIndex.map(entry => {
        const haystack = normalize(
          entry.docTitle + ' ' + entry.sectionTitle + ' ' + entry.excerpt + ' ' + entry.keywords.join(' ')
        );
        let score = 0;
        for (const t of terms) {
          if (haystack.includes(t)) score += 10;
          if (normalize(entry.sectionTitle).includes(t)) score += 20;
        }
        return { entry, score };
      }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 15);

      const container = document.getElementById('searchResults');
      if (!scored.length) {
        container.innerHTML = '<div class="search-result-item">Không tìm thấy kết quả</div>';
      } else {
        container.innerHTML = scored.map(({ entry }) => {
          const relFile = entry.file.replace(`content/${collectionId}/`, '');
          return `
            <div class="search-result-item" onclick="loadSection('${entry.id}', '${relFile}')">
              <div>${highlight(entry.sectionTitle, query)}</div>
              <div class="doc">${entry.docOrder}. ${entry.docTitle}</div>
            </div>`;
        }).join('');
      }
      container.classList.add('active');
    }

    function highlight(text, query) {
      let result = text;
      for (const t of query.trim().split(/\s+/)) {
        if (t.length < 2) continue;
        result = result.replace(new RegExp(`(${t})`, 'gi'), '<mark>$1</mark>');
      }
      return result;
    }

    let debounce;
    document.getElementById('searchInput').addEventListener('input', e => {
      clearTimeout(debounce);
      debounce = setTimeout(() => search(e.target.value), 200);
    });

    loadData();

    marked.setOptions({ breaks: true, gfm: true });
  </script>
</body>
</html>
